<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Benchmarking Confinamento</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Saira:wght@500;600;700&display=swap" />
    <script src="/js/theme.js"></script>
    <link rel="icon" type="image/png" href="/img/probeef-symbol.png" />
    <link rel="stylesheet" href="/css/app.css" />
    <link rel="stylesheet" href="/css/ticker.css" />
    <link rel="stylesheet" href="/benchmark/benchmark.css" />
  </head>
  <body>
    <div class="impersonation" id="impersonation" role="status" hidden><span id="impersonation-text"></span></div>
    <div class="app">
      <header class="topbar">
        <a class="brand" href="/portal#inicio"><img class="brand-logo logo-on-light" src="/img/probeef-horizontal.png" alt="Probeef" width="108" height="24" /><img class="brand-logo logo-on-dark" src="/img/probeef-horizontal-light.png" alt="Probeef" width="108" height="24" /><span class="brand-sub">BMK</span></a>
        <span class="bmk-title" id="bmk-title">Benchmarking Confinamento</span>
        <span class="spacer"></span>
        <label class="bmk-client" id="client-field" hidden><span class="label">Cliente</span><select id="client-select"></select></label>
        <a class="btn btn-sm" href="/portal#inicio">Voltar ao portal</a>
        <button class="btn btn-sm btn-ghost theme-toggle" type="button" data-theme-toggle aria-label="Alternar tema claro/escuro">
          <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20.2 14.6A8.5 8.5 0 0 1 9.4 3.8a8.5 8.5 0 1 0 10.8 10.8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        </button>
      </header>

      <main class="bmk" id="bmk">
        <div class="bmk-inner">
          <section class="bmk-status" id="status" aria-live="polite"></section>
          <div class="tabs" role="tablist">
            <button class="tab" role="tab" type="button" data-tab="engorda" aria-selected="true">Lotes de engorda<span class="count" id="count-engorda"></span></button>
            <button class="tab" role="tab" type="button" data-tab="recria" aria-selected="false">Recria confinada<span class="count" id="count-recria"></span></button>
            <button class="tab" role="tab" type="button" data-tab="questionario" aria-selected="false">Questionário<span class="count" id="count-questionario"></span></button>
            <button class="tab" role="tab" type="button" data-tab="resultado" aria-selected="false">Resultado</button>
            <button class="tab" role="tab" type="button" data-tab="historico" aria-selected="false">Histórico</button>
          </div>
          <section data-panel="engorda"></section>
          <section data-panel="recria" hidden></section>
          <section data-panel="questionario" hidden></section>
          <section data-panel="resultado" hidden></section>
          <section data-panel="historico" hidden></section>
        </div>
      </main>
    </div>
    <dialog id="dialog" class="dialog-wide"></dialog>
    <script type="module" src="/benchmark/app.js"></script>
  </body>
</html>
