<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Nova senha</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Saira:wght@500;600;700&display=swap" />
    <script src="/js/theme.js"></script>
    <link rel="icon" type="image/png" href="/img/probeef-symbol.png" />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div class="auth">
      <aside class="auth-side">
        <img class="auth-logo" src="/img/probeef-stacked-light.png" alt="Probeef" width="192" height="106" />
        <div>
          <h1>Seus dados de pecuária, num só lugar.</h1>
          <p>Acompanhe os indicadores do seu rebanho e do seu confinamento nos painéis liberados para a sua fazenda.</p>
        </div>
      </aside>

      <main class="auth-main">
        <div class="auth-theme">
          <button class="btn btn-sm btn-ghost theme-toggle" type="button" data-theme-toggle aria-label="Alternar tema claro/escuro">
            <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20.2 14.6A8.5 8.5 0 0 1 9.4 3.8a8.5 8.5 0 1 0 10.8 10.8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <div class="auth-card">
          <div>
            <p class="label" data-portal-name>Probeef Analytics</p>
            <h2>Criar nova senha</h2>
          </div>
          <form id="reset-form" novalidate>
            <label class="field">
              <span>Nova senha</span>
              <input id="password" name="password" type="password" autocomplete="new-password" minlength="10" required />
              <small class="muted">Pelo menos 10 caracteres.</small>
            </label>
            <label class="field">
              <span>Repita a nova senha</span>
              <input id="confirm" name="confirm" type="password" autocomplete="new-password" required />
            </label>
            <div class="alert" id="error" role="alert" hidden></div>
            <button class="btn btn-primary" type="submit">Salvar nova senha</button>
          </form>
          <div class="alert alert-ok" id="done" role="status" hidden>
            Senha alterada. <a href="/">Entrar no portal</a>
          </div>
        </div>
      </main>
    </div>
    <script type="module" src="/js/reset.js"></script>
  </body>
</html>
